<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Neon abstract hero">
  <defs>
    <radialGradient id="g1" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="85%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="55%" cy="100%" r="60%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a3e635"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#05070d"/>

  <g filter="url(#blur)">
    <circle cx="240" cy="140" r="240" fill="#22d3ee" opacity="0.30"/>
    <circle cx="980" cy="200" r="260" fill="#8b5cf6" opacity="0.26"/>
    <circle cx="620" cy="740" r="260" fill="#a3e635" opacity="0.16"/>
  </g>

  <rect width="1200" height="800" fill="url(#g1)"/>
  <rect width="1200" height="800" fill="url(#g2)"/>
  <rect width="1200" height="800" fill="url(#g3)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>

  <g fill="none" stroke="url(#line)" stroke-width="2" opacity="0.9">
    <path d="M120 620 C 320 380, 520 700, 720 420 S 1000 220, 1120 300"/>
    <path d="M120 660 C 340 420, 560 720, 760 460 S 1020 260, 1140 340" opacity="0.5"/>
  </g>

  <g fill="#e6ecf5">
    <circle cx="120" cy="620" r="4"/>
